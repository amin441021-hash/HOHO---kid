<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1328"><title>孩子课时管家</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#091124,#122d55);color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;min-height:100vh}main{max-width:520px;margin:auto;padding:24px 18px 110px}h1{font-size:25px;margin:8px 0 5px}.muted{color:#91a2c4;font-size:13px}.panel,.course{background:#192642;border:1px solid #30446e;border-radius:22px;padding:20px;margin:20px 0;box-shadow:0 8px 20px #03091733}.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;font-size:32px}.stats span{color:#a7b5cf;font-size:13px}.track{height:8px;background:#2a3855;border-radius:10px;margin-top:17px;overflow:hidden}.fill{height:100%;background:#509bff;border-radius:10px}.course{display:flex;align-items:center;gap:14px;margin:12px 0;border-left:5px solid var(--accent)}.icon{font-size:28px;background:#233657;border-radius:15px;width:57px;height:57px;display:grid;place-items:center}.grow{flex:1;min-width:0}.course h3{margin:0 0 7px;font-size:18px}.course .track{margin-top:10px;height:6px}button{border:0;border-radius:13px;padding:12px 15px;font-weight:700;font-size:15px;background:#4b9fff;color:#06142a;cursor:pointer}button.secondary{background:#283a5c;color:#eaf2ff}button.danger{background:#65334b;color:#ffd5de}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#111c33;border-top:1px solid #35486c;padding:12px 5px calc(12px + env(safe-area-inset-bottom))}.nav button{background:none;color:#a8b8d7;padding:6px;font-size:14px}.nav button.active{color:#65b8ff}.hidden{display:none!important}input,select,textarea{width:100%;background:#101c34;border:1px solid #3b5178;color:white;border-radius:12px;padding:12px;font-size:16px;margin:7px 0 13px}label{font-size:13px;color:#bac8e0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px}.day{min-height:54px;text-align:center;padding:10px 0 4px;border-radius:12px;background:#202e4a;color:#dce7fa;font-size:14px;position:relative}.day.off{opacity:.18}.day.selected{background:#275488;outline:1px solid #56b1ff}.day small{display:block;color:#4ce09a;font-size:12px;margin-top:3px}.pill{font-size:12px;color:#9bb4d8}.record{border-bottom:1px solid #334360;padding:12px 0}.record strong{font-size:14px}.record p{margin:5px 0;color:#b3c1d9;font-size:13px}.record button{padding:7px 11px;font-size:12px}dialog{width:min(94vw,440px);background:#192642;color:#fff;border:1px solid #48618d;border-radius:20px;padding:22px}dialog::backdrop{background:#000a}h2{font-size:20px} .empty{text-align:center;color:#a8b7d0;padding:25px 10px} .hint{font-size:12px;color:#91a8ca;line-height:1.7} .badge{color:#53e2a1}</style></head><body><main><header><div class="muted">🏠 家庭专用 · 单个孩子</div><h1>孩子课时管家</h1><div class="muted">课程安排与剩余课时，一目了然</div></header><section id="home"><div class="panel"><div class="stats"><div><b id="total">0</b><span>总课时</span></div><div><b id="used" style="color:#5ca6ff">0</b><span>已消课</span></div><div><b id="left" style="color:#4de298">0</b><span>剩余</span></div></div><div class="track"><div class="fill" id="overall"></div></div></div><div class="row"><h2>🎯 我的课程</h2><button onclick="openCourse()">＋ 新增</button></div><div id="courses"></div></section><section id="calendarView" class="hidden"><div class="row"><h2>📅 课程日历</h2><select id="calendarCourse" style="width:45%;margin:0" onchange="drawCalendar()"></select></div><div class="panel"><div class="row"><button class="secondary" onclick="changeMonth(-1)">‹</button><strong id="monthTitle"></strong><button class="secondary" onclick="changeMonth(1)">›</button></div><div class="calendar" id="calendar"></div></div><div class="panel"><h3 id="selectedDateTitle">选择日期</h3><div id="dayRecords"></div><button onclick="openRecord()">＋ 登记课程</button></div></section><section id="recordsView" class="hidden"><div class="row"><h2>📋 课程记录</h2><button onclick="openRecord()">＋ 登记</button></div><div class="panel" id="records"></div></section><section id="settingsView" class="hidden"><h2>⚙️ 数据管理</h2><div class="panel"><p>所有数据保存在当前手机浏览器中。建议定期导出备份，清除浏览器数据可能导致记录丢失。</p><button onclick="exportData()">⬇ 导出备份文件</button><p><label>恢复备份（选择此前导出的 JSON 文件）</label><input type="file" accept="application/json,.json" id="importFile" onchange="importData(event)"></p><p class="hint">这是免费离线单文件工具；不同手机或浏览器之间不会自动同步。首次打开文件后请勿依赖无备份的浏览器缓存。</p></div><div class="panel"><h3>课程管理</h3><div id="manageCourses"></div></div></section></main><nav class="nav"><button class="active" onclick="switchTab('home',this)">🏠<br>首页</button><button onclick="switchTab('calendarView',this)">📅<br>日历</button><button onclick="switchTab('recordsView',this)">📝<br>记录</button><button onclick="switchTab('settingsView',this)">⚙️<br>设置</button></nav><dialog id="courseDialog"><h2 id="courseDialogTitle">新增课程</h2><form id="courseForm"><input type="hidden" id="courseId"><label>课程名称</label><input id="courseName" required placeholder="例如：游泳课"><label>图标</label><select id="courseIcon"><option>🏊</option><option>🏸</option><option>🎨</option><option>🎹</option><option>🎤</option><option>⚽</option><option>📚</option><option>🧩</option></select><label>初始购买课时（可填小数）</label><input id="courseHours" type="number" min="0" step="0.5" required value="10"><label>此前已使用课时</label><input id="courseUsed" type="number" min="0" step="0.5" value="0"><div class="row"><button type="button" class="secondary" onclick="courseDialog.close()">取消</button><button type="submit">保存课程</button></div></form></dialog><dialog id="recordDialog"><h2>登记课程</h2><form id="recordForm"><label>课程</label><select id="recordCourse" required></select><label>日期</label><input type="date" id="recordDate" required><label>状态</label><select id="recordStatus"><option value="done">已上课（扣课时）</option><option value="planned">已预约（不扣课时）</option><option value="leave">请假/取消（不扣课时）</option><option value="extra">充值课时（增加余额）</option></select><label>课时数量</label><input type="number" id="recordHours" min="0.5" step="0.5" value="1" required><label>备注（可选）</label><textarea id="recordNote" rows="2" placeholder="如：自由泳打腿练习"></textarea><div class="row"><button type="button" class="secondary" onclick="recordDialog.close()">取消</button><button type="submit">保存记录</button></div></form></dialog><script>
const KEY='family_lessons_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.courses)||!Array.isArray(db.records))db={courses:[{id:'c1',name:'羽毛球课',icon:'🏸',hours:36,baseline:14},{id:'c2',name:'游泳课',icon:'🏊',hours:10,baseline:2},{id:'c3',name:'画画课',icon:'🎨',hours:10,baseline:0},{id:'c4',name:'钢琴课',icon:'🎹',hours:14,baseline:0},{id:'c5',name:'合唱课',icon:'🎤',hours:18,baseline:0}],records:[]};const $=id=>document.getElementById(id);const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let month=new Date();month.setDate(1);let selected=today();let active='home';function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(c){let rs=db.records.filter(r=>r.courseId===c.id),used=c.baseline+rs.filter(r=>r.status==='done').reduce((s,r)=>s+r.hours,0),total=c.hours+rs.filter(r=>r.status==='extra').reduce((s,r)=>s+r.hours,0);return{total,used,left:total-used}}function render(){let t=0,u=0;db.courses.forEach(c=>{let s=stats(c);t+=s.total;u+=s.used});$('total').textContent=t;$('used').textContent=u;$('left').textContent=t-u;$('overall').style.width=(t?Math.min(100,u/t*100):0)+'%';let colors=['#45df8b','#39bdf6','#fc718a','#bb7cf8','#ffcc4d'];$('courses').innerHTML=db.courses.length?db.courses.map((c,i)=>{let s=stats(c);return `<div class="course" style="--accent:${colors[i%5]}"><div class="icon">${escapeHtml(c.icon)}</div><div class="grow"><h3>${escapeHtml(c.name)}</h3><div class="muted">已用 ${s.used} · 剩余 <b class="badge">${s.left}</b> / ${s.total} 节</div><div class="track"><div class="fill" style="background:${colors[i%5]};width:${s.total?Math.min(100,s.used/s.total*100):0}%"></div></div>${s.left<=3?'<div class="hint" style="color:#ffc86d">⚠️ 剩余课时不足3节</div>':''}</div><button style="background:${colors[i%5]}" onclick="selectCourse('${c.id}')">进入</button></div>`}).join(''):'<div class="empty">暂无课程，点击新增课程</div>';$('manageCourses').innerHTML=db.courses.map(c=>`<div class="row record"><span>${escapeHtml(c.icon)} ${escapeHtml(c.name)}</span><span><button class="secondary" onclick="openCourse('${c.id}')">编辑</button> <button class="danger" onclick="deleteCourse('${c.id}')">删除</button></span></div>`).join('');for(let id of ['calendarCourse','recordCourse']){let v=$(id).value;$(id).innerHTML=db.courses.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');if(db.courses.some(c=>c.id===v))$(id).value=v}drawCalendar();drawRecords()}
function switchTab(tab,btn){active=tab;for(let id of ['home','calendarView','recordsView','settingsView'])$(id).classList.toggle('hidden',id!==tab);document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));(btn||document.querySelectorAll('.nav button')[[ 'home','calendarView','recordsView','settingsView'].indexOf(tab)]).classList.add('active');render()}function selectCourse(id){switchTab('calendarView');$('calendarCourse').value=id;drawCalendar()}function openCourse(id){let c=db.courses.find(x=>x.id===id);$('courseDialogTitle').textContent=c?'编辑课程':'新增课程';$('courseId').value=c?.id||'';$('courseName').value=c?.name||'';$('courseIcon').value=c?.icon||'🏊';$('courseHours').value=c?.hours??10;$('courseUsed').value=c?.baseline??0;$('courseDialog').showModal()}$('courseForm').onsubmit=e=>{e.preventDefault();let id=$('courseId').value,c={id:id||'c'+Date.now(),name:$('courseName').value.trim(),icon:$('courseIcon').value,hours:Number($('courseHours').value),baseline:Number($('courseUsed').value)};if(c.baseline>c.hours){alert('已使用课时不能超过初始购买课时');return}if(id)db.courses=db.courses.map(x=>x.id===id?c:x);else db.courses.push(c);$('courseDialog').close();save()};function deleteCourse(id){if(!confirm('删除课程会同时删除该课程全部历史记录，确定吗？'))return;db.courses=db.courses.filter(c=>c.id!==id);db.records=db.records.filter(r=>r.courseId!==id);save()}
function changeMonth(n){month.setMonth(month.getMonth()+n);drawCalendar()}function drawCalendar(){let id=$('calendarCourse').value;let y=month.getFullYear(),m=month.getMonth();$('monthTitle').textContent=`${y}年${m+1}月`;let html=['日','一','二','三','四','五','六'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('');let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<Math.ceil((first+days)/7)*7;i++){let day=i-first+1;if(day<1||day>days){html+='<div class="day off"></div>';continue}let date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;let rs=db.records.filter(r=>r.courseId===id&&r.date===date);let dots=rs.some(r=>r.status==='done')?'●':rs.some(r=>r.status==='planned')?'🔵':rs.some(r=>r.status==='leave')?'🟠':rs.some(r=>r.status==='extra')?'＋':'';html+=`<div class="day ${date===selected?'selected':''}" onclick="selectDate('${date}')">${day}<small>${dots}</small></div>`}$('calendar').innerHTML=html;$('selectedDateTitle').textContent=selected+' · 上课记录';let rr=db.records.filter(r=>r.date===selected&&r.courseId===id);$('dayRecords').innerHTML=rr.length?rr.map(recordHtml).join(''):'<div class="empty">当天暂无记录</div>'}function selectDate(d){selected=d;drawCalendar()}function openRecord(){if(!db.courses.length){alert('请先新增课程');return}$('recordDate').value=selected;$('recordCourse').value=$('calendarCourse').value||db.courses[0].id;$('recordStatus').value='done';$('recordHours').value=1;$('recordNote').value='';$('recordDialog').showModal()}$('recordForm').onsubmit=e=>{e.preventDefault();let r={id:'r'+Date.now(),courseId:$('recordCourse').value,date:$('recordDate').value,status:$('recordStatus').value,hours:Number($('recordHours').value),note:$('recordNote').value.trim()};let c=db.courses.find(c=>c.id===r.courseId);if(r.status==='done'&&stats(c).left<r.hours&&!confirm('扣除后课时将为负数，仍要继续吗？'))return;db.records.push(r);selected=r.date;$('recordDialog').close();save()};const statusLabel={done:'🟢 已上课',planned:'🔵 已预约',leave:'🟠 请假/取消',extra:'🟣 充值课时'};function recordHtml(r){let c=db.courses.find(c=>c.id===r.courseId);return `<div class="record"><div class="row"><strong>${escapeHtml(c?.name||'已删除课程')} · ${statusLabel[r.status]||''}</strong><button class="danger" onclick="deleteRecord('${r.id}')">撤销</button></div><p>${r.date} · ${r.hours}节 ${r.note?'· '+escapeHtml(r.note):''}</p></div>`}function drawRecords(){$('records').innerHTML=db.records.length?[...db.records].sort((a,b)=>b.date.localeCompare(a.date)).map(recordHtml).join(''):'<div class="empty">还没有上课记录</div>'}function deleteRecord(id){if(confirm('确定删除这条记录并恢复对应课时统计吗？')){db.records=db.records.filter(r=>r.id!==id);save()}}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='孩子课时备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.courses)||!Array.isArray(d.records))throw Error('格式错误');if(confirm('恢复备份会覆盖手机当前所有课程与记录，确定吗？')){db=d;save();alert('恢复成功')}}catch(err){alert('备份文件无效：'+err.message)}e.target.value=''}render();</script></body></html>
